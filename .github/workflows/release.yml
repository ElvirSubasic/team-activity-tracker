name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run package:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        run: npm run package:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: dist/*.exe
          if-no-files-found: error

  publish-release:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: release-assets

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This job publishes releases only for tag refs."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF_NAME}"

          if gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --repo "${GH_REPO}" --clobber
          else
            gh release create "${TAG_NAME}" release-assets/* --repo "${GH_REPO}" --generate-notes
          fi
